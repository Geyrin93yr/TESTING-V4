<!-- This page displays an assignment and allows the user to submit or interact with assignment content. -->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>งานที่ได้รับมอบหมาย — Baan Programmer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-page">
  <div class="app-shell">
    <div class="app-topbar">
      <div class="icon-btn" onclick="history.back()">←</div>
      <div class="profile-chip" onclick="toggleDropdown()">
        <div class="avatar">G</div>
        <span class="caret">▾</span>
      </div>
    </div>

    <div class="app-body">

      <div class="assignment-hero">
        <div class="assignment-hero-title-row">
          <h2 id="assignmentTitle">Assignment 1</h2>
          <div class="assignment-hero-icon">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6a1 1 0 0 1 1 1v2H8V5a1 1 0 0 1 1-1Z"/><rect x="5" y="4" width="14" height="18" rx="2"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="16" y2="15"/><line x1="8" y1="19" x2="13" y2="19"/></svg>
          </div>
        </div>

        <p class="assignment-desc" id="assignmentDesc" style="display:none"></p>

        <!-- ติวเตอร์: ปุ่มแก้ไข -->
        <div class="tutor-tools" id="tutorTools" style="display:none">
          <button class="btn-edit" type="button" onclick="openEditModal()">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
            แก้ไข
          </button>
        </div>

        <div class="upload-row">
          <label class="upload-input" for="assignmentFile">
            <span id="uploadFileName">อัปโหลดไฟล์</span>
          </label>
          <input type="file" id="assignmentFile" style="display:none" onchange="onAssignmentFileChosen(event)">
          <button class="btn-confirm" onclick="confirmAssignmentUpload()">ยืนยัน</button>
        </div>
        <p class="grader-status" id="graderStatus" style="display:none"></p>
      </div>

      <div class="result-list" id="resultList">
        <div class="result-row result-pass">Pass</div>
        <div class="result-row result-warn">200/400</div>
        <div class="result-row result-warn">100/400</div>
        <div class="result-row result-error">Error</div>
      </div>

    </div>

    <div class="dropdown" id="profileDropdown">
      <a class="dropdown-item" href="profile.html" style="display:block;color:inherit;">โปรไฟล์ของฉัน</a>
      <a class="dropdown-item" href="settings.html" style="display:block;color:inherit;">ตั้งค่า</a>
      <div class="dropdown-item danger" onclick="logout()">ออกจากระบบ</div>
    </div>
  </div>
</div>


<!-- Edit assignment modal (tutor only) -->
<div class="modal-overlay" id="editModal">
  <div class="join-modal">
    <h2>แก้ไข assignment</h2>
    <div class="join-modal-section">
      <h3>ชื่อ assignment</h3>
      <input type="text" id="editName" oninput="checkEditForm()">
    </div>
    <div class="join-modal-section">
      <h3>รายละเอียด <span class="optional">(ไม่บังคับ)</span></h3>
      <textarea id="editDesc" rows="3" placeholder="อธิบายโจทย์หรือเงื่อนไขการส่งงาน"></textarea>
    </div>
    <div class="join-modal-actions">
      <span class="link" onclick="closeEditModal()">ยกเลิก</span>
      <button class="link-btn" id="editSaveBtn" onclick="saveEditAssignment()">บันทึก</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const courseId = params.get('c') || localStorage.getItem('baanProgrammerCourseId') || 'python';
  const assignmentId = params.get('id');
  const tutor = isTutor();
  let assignment = null;

  function findAssignment() {
    const items = getAssignments(courseId);
    return items.find(a => a.id === assignmentId) || null;
  }

  function persistAssignment() {
    const items = getAssignments(courseId).map(a => a.id === assignment.id ? assignment : a);
    saveAssignments(courseId, items);
  }

  function renderAssignmentPage() {
    assignment = findAssignment();
    const title = assignment ? assignment.name : (params.get('name') || 'Assignment 1');
    document.getElementById('assignmentTitle').textContent = title;
    document.title = title + ' — Baan Programmer';

    const descEl = document.getElementById('assignmentDesc');
    if (assignment && assignment.desc) {
      descEl.textContent = assignment.desc;
      descEl.style.display = 'block';
    } else {
      descEl.style.display = 'none';
    }

    if (tutor) applyTutorView();
  }

  /* ----- มุมติวเตอร์: แก้ไข + อัปโหลดเกรดเดอร์ ----- */
  function applyTutorView() {
    document.getElementById('tutorTools').style.display = assignment ? 'flex' : 'none';
    document.getElementById('uploadFileName').textContent = 'อัปโหลดเกรดเดอร์';
    document.getElementById('resultList').style.display = 'none'; // ผลตรวจเป็นของนักเรียน
    renderGraderStatus();
  }

  function renderGraderStatus() {
    const el = document.getElementById('graderStatus');
    if (assignment && assignment.grader) {
      el.textContent = 'เกรดเดอร์ปัจจุบัน: ' + assignment.grader;
      el.style.display = 'block';
    } else {
      el.textContent = 'ยังไม่ได้อัปโหลดเกรดเดอร์';
      el.style.display = 'block';
    }
  }

  function openEditModal() {
    if (!assignment) return;
    document.getElementById('editName').value = assignment.name;
    document.getElementById('editDesc').value = assignment.desc || '';
    checkEditForm();
    document.getElementById('editModal').classList.add('show');
    document.getElementById('editName').focus();
  }

  function closeEditModal() {
    document.getElementById('editModal').classList.remove('show');
  }

  function checkEditForm() {
    document.getElementById('editSaveBtn').disabled = document.getElementById('editName').value.trim().length === 0;
  }

  function saveEditAssignment() {
    const name = document.getElementById('editName').value.trim();
    if (!name || !assignment) return;
    assignment.name = name;
    assignment.desc = document.getElementById('editDesc').value.trim();
    persistAssignment();
    closeEditModal();
    renderAssignmentPage();
    showToast('บันทึกการแก้ไขแล้ว');
  }

  function defaultUploadLabel() {
    return tutor ? 'อัปโหลดเกรดเดอร์' : 'อัปโหลดไฟล์';
  }

  function onAssignmentFileChosen(event){
    const file = event.target.files[0];
    document.getElementById('uploadFileName').textContent = file ? file.name : defaultUploadLabel();
  }

  function confirmAssignmentUpload(){
    const fileInput = document.getElementById('assignmentFile');
    if(!fileInput.files.length){
      showToast('กรุณาเลือกไฟล์ก่อนยืนยัน');
      return;
    }

    if (tutor) {
      if (!assignment) { showToast('ไม่พบ assignment นี้'); return; }
      assignment.grader = fileInput.files[0].name;
      persistAssignment();
      renderGraderStatus();
      fileInput.value = '';
      document.getElementById('uploadFileName').textContent = defaultUploadLabel();
      showToast('อัปโหลดเกรดเดอร์เรียบร้อยแล้ว');
      return;
    }

    const list = document.getElementById('resultList');
    const row = document.createElement('div');
    row.className = 'result-row result-warn';
    row.textContent = 'รอตรวจ';
    list.insertBefore(row, list.firstChild);

    fileInput.value = '';
    document.getElementById('uploadFileName').textContent = defaultUploadLabel();
    showToast('ส่งงานเรียบร้อยแล้ว');
  }

  document.addEventListener('DOMContentLoaded', renderAssignmentPage);
</script>
</body>
</html>
